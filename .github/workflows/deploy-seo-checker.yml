name: Build and deploy SEO keyword checker to Gcore CaaS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seo-keyword-checker/**"
      - ".github/workflows/deploy-seo-checker.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}/seo-keyword-checker' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./seo-keyword-checker
          push: true
          tags: ${{ env.IMAGE }}

      - id: deploy
        uses: gcore-github-actions/deploy-container@v1
        with:
          api-token: ${{ secrets.GCLOUD_API_TOKEN }}
          project-id: ${{ vars.GCLOUD_PROJECT }}
          region-id: ${{ vars.GCLOUD_REGION }}
          name: seo-keyword-checker
          image: ${{ env.IMAGE }}
          listening-port: 8080
          flavor: 1140mCPU-2048MiB
          timeout: 180
          scale-min: 1
          scale-max: 2

      - name: Show deployed address
        run: echo "Deployed at ${{ steps.deploy.outputs.address }}"
